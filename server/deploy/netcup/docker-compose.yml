# Subsumio engine — single-box production stack on Netcup (EU).
#   db     — Postgres 16 + pgvector (brain + web auth store)
#   engine — the gbrain HTTP API + in-process ingestion worker (parses PDFs,
#            builds embeddings, answers queries) on :3131
#   web    — Next.js dashboard on :3000
#   caddy  — reverse proxy with automatic Let's Encrypt HTTPS for APP_DOMAIN
#            and ENGINE_DOMAIN
#
# Bring up:  cd server/deploy/netcup && cp .env.example .env && <edit .env> &&
#            docker compose up -d --build
# All secrets come from .env (never committed). Files live on named volumes;
# point APP_DOMAIN + ENGINE_DOMAIN DNS A-records at this box first so Caddy
# can issue TLS.
#
# `name:` below pins the Compose project id explicitly. Without it, Compose
# derives the project name from the containing directory's basename — and
# sibling apps share this box with deploy dirs of the same name (e.g. a
# shop's own deploy/netcup/). Two compose files resolving to the same
# implicit project name means `docker compose up` in ONE app's directory can
# remove the OTHER app's containers as "orphans" (2026-07-14 incident: a
# sibling app's deploy wiped this entire stack — db, engine, clamav, web,
# caddy, cron, backup — while its own container survived, because they
# collided on the same implicit project name). Pinning an explicit name here
# makes this project immune to that collision regardless of what any other
# compose file on the box is named.
name: subsumio-engine

# Container logs are capped: one unrotated log grew to 1.4 GB and filled the
# disk, which stopped the engine for weeks. Anchors are applied per service.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  clamav:
    logging: *default-logging
    image: clamav/clamav:stable
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    # Signature reloads briefly hold two databases in memory.
    mem_limit: ${CLAMAV_MEM_LIMIT:-4g}
    environment:
      # Keep ClamAV's INSTREAM ceiling aligned with the application's 500 MB
      # document limit. The image default is only 100 MB and otherwise causes
      # valid large uploads to fail closed as "scanner unavailable".
      CLAMD_CONF_StreamMaxLength: "524288000"
      CLAMD_CONF_MaxFileSize: "524288000"
      CLAMD_CONF_MaxScanSize: "1073741824"
    volumes:
      - clamav-data:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping 1 >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    # clamd stays on the private compose network; no host port is published.

  db:
    logging: *default-logging
    build:
      context: .
      dockerfile: Dockerfile.db
    image: subsumio-engine-db:latest
    restart: unless-stopped
    # No memory limit on purpose: the database keeps its vector and text
    # indexes in memory; the other services are capped so they cannot push
    # it into the OOM killer. (Hardening options such as no-new-privileges
    # belong here too, but any change to this service recreates the database
    # on the next deploy — add them in a planned maintenance window.)
    # Memory settings come from .env so one compose file fits both boxes. The
    # defaults suit 16 GB; on the 64 GB server the 14 GB vector index and the
    # text indexes must stay in memory (see server/deploy/netcup/RUNBOOK.md).
    shm_size: ${PG_SHM_SIZE:-1gb}
    command: >
      postgres
      -c shared_buffers=${PG_SHARED_BUFFERS:-512MB}
      -c effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-2GB}
      -c work_mem=${PG_WORK_MEM:-16MB}
      -c maintenance_work_mem=${PG_MAINTENANCE_WORK_MEM:-512MB}
      -c effective_io_concurrency=200
      -c wal_buffers=16MB
      -c checkpoint_completion_target=0.9
      -c random_page_cost=1.1
      -c max_parallel_workers=${PG_MAX_PARALLEL_WORKERS:-2}
      -c max_parallel_workers_per_gather=${PG_MAX_PARALLEL_WORKERS_PER_GATHER:-1}
      -c max_parallel_maintenance_workers=${PG_MAX_PARALLEL_MAINTENANCE_WORKERS:-2}
      -c autovacuum=on
      -c autovacuum_naptime=30s
      -c shared_preload_libraries=pg_search
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-subsumio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-subsumio}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-subsumio} -d ${POSTGRES_DB:-subsumio}"]
      interval: 10s
      timeout: 5s
      retries: 6
    # Published on localhost only — allows SSH-tunnel access for local dev
    # without exposing the DB to the internet. Engine still uses the compose
    # network internally. To tunnel: ssh -L 15432:localhost:5432 subsumio-netcup
    ports:
      - "127.0.0.1:5432:5432"

  engine:
    logging: *default-logging
    build:
      context: ../.. # = server/  (where the Dockerfile lives)
      dockerfile: Dockerfile
    restart: unless-stopped
    shm_size: 1gb
    # The engine parses untrusted uploads (LibreOffice, Ghostscript, qpdf,
    # readpst). It runs as uid 10001 (server/Dockerfile), holds no
    # capabilities, cannot gain privileges through setuid binaries, and is
    # bounded in memory, CPU and processes so a runaway conversion cannot pull
    # the database down with it. Limits are tunable in .env.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: ${ENGINE_MEM_LIMIT:-16g}
    cpus: ${ENGINE_CPUS:-8}
    pids_limit: ${ENGINE_PIDS_LIMIT:-4096}
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-subsumio}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-subsumio}
      PORT: "3131"
      SUBSUMIO_HOME: /data
      GBRAIN_HOME: /data # legacy alias for engine internals
      CLAMAV_HOST: clamav:3310
      SUBSUMIO_PRESIGNED_UPLOAD_ENABLED: ${SUBSUMIO_PRESIGNED_UPLOAD_ENABLED:-false}
      # Unified corpus root — engine reads law files from here
      LAW_CORPUS_ROOT: /law-corpus
    volumes:
      - engine-data:/data # uploaded files / vault on durable volume
      # Law corpus — bind mount to host directory where fetch scripts placed files
      - ${LAW_CORPUS_HOST_DIR:-/opt/subsumio-data/law-corpus}:/law-corpus:ro
      # Read-only ADVOKAT export/document mirror. Point the host side at an
      # SMB/CIFS mount or scheduled ADVOKAT export directory.
      - ${ADVOKAT_IMPORT_HOST_PATH:-./imports/advokat}:/imports/advokat:ro
    depends_on:
      db:
        condition: service_healthy
      clamav:
        condition: service_healthy
    # Own edge network, shared only with the reverse proxy (see the
    # `networks:` section at the end). No other project's container can
    # reach the engine directly.
    networks:
      default:
      subsumio-edge:
        aliases:
          - engine
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'bun -e "fetch(''http://localhost:3131/health'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  web:
    logging: *default-logging
    build:
      context: ../../.. # = repo root (Next.js app)
      dockerfile: Dockerfile.web
      args:
        NEXT_PUBLIC_APP_URL: "https://${APP_DOMAIN:?set APP_DOMAIN in .env}"
        NEXT_PUBLIC_SITE_URL: "https://${APP_DOMAIN:?set APP_DOMAIN in .env}"
        NEXT_PUBLIC_DIRECT_UPLOAD_MAX_BYTES: "${NEXT_PUBLIC_DIRECT_UPLOAD_MAX_BYTES:-524288000}"
        NEXT_PUBLIC_ENGINE_URL: "https://${ENGINE_DOMAIN:?set ENGINE_DOMAIN in .env}"
        NEXT_PUBLIC_SENTRY_DSN: "${NEXT_PUBLIC_SENTRY_DSN:-}"
    restart: unless-stopped
    # Runs as the image's `bun` user; needs no capabilities.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: ${WEB_MEM_LIMIT:-6g}
    cpus: ${WEB_CPUS:-4}
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      NEXT_TELEMETRY_DISABLED: "1"
      SUBSUMIO_API_URL: http://engine:3131
      NEXT_PUBLIC_APP_URL: "https://${APP_DOMAIN:?set APP_DOMAIN in .env}"
      NEXT_PUBLIC_SITE_URL: "https://${APP_DOMAIN:?set APP_DOMAIN in .env}"
      SUBSUMIO_AUTH_DATABASE_URL: postgres://${POSTGRES_USER:-subsumio}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-subsumio}?sslmode=disable
      DATABASE_URL: postgres://${POSTGRES_USER:-subsumio}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-subsumio}?sslmode=disable
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-524288000}
      MAX_TABULAR_UPLOAD_BYTES: ${MAX_TABULAR_UPLOAD_BYTES:-20971520}
      NEXT_PUBLIC_DIRECT_UPLOAD_MAX_BYTES: ${NEXT_PUBLIC_DIRECT_UPLOAD_MAX_BYTES:-524288000}
      NEXT_PUBLIC_ENGINE_URL: "https://${ENGINE_DOMAIN:?set ENGINE_DOMAIN in .env}"
      # Operator console (/ops) and operator APIs are served only on this host.
      OPS_HOSTS: ${OPS_DOMAIN:-ops.subsum.io}
      BACKUP_STATUS_FILE: /backup-status/last-success
      # Firm civil time. Code uses explicit Europe/Vienna helpers
      # (src/lib/datetime.ts); this is the safety net for anything that
      # still reads the process timezone.
      TZ: Europe/Vienna
      # The edge session verifier asks this origin for revocations. Local
      # loopback keeps those checks off the public domain (and off its shared
      # per-IP rate limit).
      SUBSUMIO_INTERNAL_URL: http://localhost:3000
    volumes:
      # Corpus read-only mount so the dashboard can enumerate local disk files.
      # Mounted at /app/law-corpus to match src/lib/corpus-index.ts (NORMALIZED_ROOT).
      - ${LAW_CORPUS_HOST_DIR:-/opt/subsumio-data/law-corpus}:/app/law-corpus:ro
      # Timestamp of the last successful backup, checked by /api/cron/health.
      - backup-status:/backup-status:ro
      # Persistent web state (SUBSUMIO_DATA_DIR, see Dockerfile.web). Without it
      # every file-backed store is lost on each --force-recreate.
      - web-data:/app/.data
    depends_on:
      db:
        condition: service_healthy
      engine:
        condition: service_healthy
    networks:
      default:
      subsumio-edge:
        aliases:
          - web
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'bun -e "fetch(''http://localhost:3000/api/health'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  # Standalone proxy for a box without the shared /opt/caddy proxy (fresh
  # install, disaster recovery). Production does not start it: it sits behind
  # a profile, so a plain `docker compose up` never competes for ports 80/443.
  #   docker compose -p subsumio-engine --profile standalone-proxy up -d caddy
  # ./Caddyfile is the reference configuration for the shared proxy too.
  caddy:
    logging: *default-logging
    profiles: ["standalone-proxy"]
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?set APP_DOMAIN in .env}
      ENGINE_DOMAIN: ${ENGINE_DOMAIN:?set ENGINE_DOMAIN in .env}
      OPS_DOMAIN: ${OPS_DOMAIN:-ops.subsum.io}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web
      - engine

  cron:
    logging: *default-logging
    # Tools baked in at build time (images/cron) — no package mirror at start.
    build:
      context: ./images/cron
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 256m
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    environment:
      CRON_SECRET: ${CRON_SECRET:?set CRON_SECRET in .env}
      # Failed jobs mail this address (cronjob.sh; at most once per job/hour).
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-Subsumio <hello@subsum.io>}
      QUEUE_ALERT_EMAIL: ${QUEUE_ALERT_EMAIL:-}
      # Optional dead-man's-switch pings after a SUCCESSFUL run (cronjob.sh,
      # RUNBOOK "Cron-Überwachung"). Empty = no ping.
      CRON_HEARTBEAT_URL_DEADLINES: ${CRON_HEARTBEAT_URL_DEADLINES:-}
      CRON_HEARTBEAT_URL_DEADLINE_REMINDERS: ${CRON_HEARTBEAT_URL_DEADLINE_REMINDERS:-}
      CRON_HEARTBEAT_URL_DEADLINE_ALERTS: ${CRON_HEARTBEAT_URL_DEADLINE_ALERTS:-}
      CRON_HEARTBEAT_URL_HEALTH: ${CRON_HEARTBEAT_URL_HEALTH:-}
      CRON_HEARTBEAT_URL_APPOINTMENT_REMINDERS: ${CRON_HEARTBEAT_URL_APPOINTMENT_REMINDERS:-}
      CRON_HEARTBEAT_URL_IMAP_SYNC: ${CRON_HEARTBEAT_URL_IMAP_SYNC:-}
      CRON_HEARTBEAT_URL_DUNNING_RUN: ${CRON_HEARTBEAT_URL_DUNNING_RUN:-}
      CRON_HEARTBEAT_URL_MONTHLY_INVOICE: ${CRON_HEARTBEAT_URL_MONTHLY_INVOICE:-}
      CRON_HEARTBEAT_URL_SANCTIONS_SYNC: ${CRON_HEARTBEAT_URL_SANCTIONS_SYNC:-}
    volumes:
      - ./crontab:/etc/crontab:ro
      - ./cronjob.sh:/etc/cronjob.sh:ro

  # Encrypted offsite backup + restore-verification (restic → Hetzner Object
  # Storage / Storage Box). Daily pg_dump + original files; weekly restore drill.
  # Inert until the BACKUP_* vars are set in .env — the stack runs fine without
  # them (the service just logs that the repo isn't configured and idles).
  backup:
    logging: *default-logging
    # Tools baked in at build time (images/backup) — no package mirror at start.
    build:
      context: ./images/backup
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # restic repo + encryption key (offline-stored password!)
      RESTIC_REPOSITORY: ${BACKUP_RESTIC_REPOSITORY:-}
      RESTIC_PASSWORD: ${BACKUP_RESTIC_PASSWORD:-}
      # s3: repos (Hetzner Object Storage / R2 / S3)
      AWS_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:-}
      # Postgres connection (same network as db)
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-subsumio}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-subsumio}
      # Alert channel (reused from the queue-alert watchdog)
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-Subsumio <hello@subsum.io>}
      QUEUE_ALERT_EMAIL: ${QUEUE_ALERT_EMAIL:-}
      # Local encrypted copy — runs even without an offsite repo, so a firm is
      # never left with no backup at all.
      BACKUP_LOCAL_DIR: ${BACKUP_LOCAL_DIR:-/backups}
      BACKUP_LOCAL_PASSPHRASE: ${BACKUP_LOCAL_PASSPHRASE:-}
      BACKUP_LOCAL_KEEP_DAYS: ${BACKUP_LOCAL_KEEP_DAYS:-14}
      # The local archive also holds the original files (/data); needs disk
      # space for them per retained day. 0 = database only (health then warns).
      BACKUP_LOCAL_INCLUDE_FILES: ${BACKUP_LOCAL_INCLUDE_FILES:-1}
      # Read by /api/cron/health to alert when backups stop running.
      BACKUP_STATUS_FILE: /backup-status/last-success
    volumes:
      # Original files — only needed when STORAGE_BACKEND=local. Harmless if s3.
      - engine-data:/data:ro
      # Web app state (file-backed stores, WhatsApp media) — backed up too.
      - web-data:/web-data:ro
      - ./backup:/backup:ro
      - backup-local:/backups
      - backup-status:/backup-status

  # Corpus Pipeline Orchestrator — supervises the legal-corpus ingest chain
  # (backfill → import → embed → reconcile). State is DB-backed via
  # pipeline_state table, so container restarts are safe. Uses PID tracking
  # + timeout enforcement for child processes. See scripts/corpus-pipeline.ts.
  #
  # The law-corpus volume must be pre-populated (fetch-all-at-judikatur.ts,
  # import-eu-corpus.ts, etc.) — this service does NOT do initial discovery.
  # It only orchestrates backfill/import/embed for files already on disk.
  corpus-pipeline:
    logging: *default-logging
    build:
      context: ../.. # = server/ dir
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      engine:
        condition: service_healthy
    networks:
      - default
    # Same image as the engine, but the pipeline writes into the host corpus
    # directory and /root/subsumio-pipeline-logs (root-owned), so it keeps
    # running as root — explicitly, since the image default is uid 10001. It
    # handles the public law corpus, not firm uploads. No privilege gain,
    # bounded resources.
    user: "0:0"
    security_opt:
      - no-new-privileges:true
    mem_limit: ${PIPELINE_MEM_LIMIT:-12g}
    cpus: ${PIPELINE_CPUS:-6}
    pids_limit: ${PIPELINE_PIDS_LIMIT:-4096}
    environment:
      # DB connection (same network as db)
      DATABASE_URL: postgres://${POSTGRES_USER:-subsumio}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-subsumio}?sslmode=disable
      # Engine API (for import + embed calls)
      SUBSUMIO_ENGINE_URL: http://engine:3131
      # Pipeline config
      PIPELINE_INTERVAL_S: ${PIPELINE_INTERVAL_S:-600}
      PIPELINE_SAMPLE_SIZE: ${PIPELINE_SAMPLE_SIZE:-50}
      PIPELINE_RECONCILE_GAP: ${PIPELINE_RECONCILE_GAP:-0.05}
      # Alert webhook (optional — set ALERT_WEBHOOK in .env to enable)
      ALERT_WEBHOOK: ${ALERT_WEBHOOK:-}
      # Error alerts (delta sync, index crawls) mail the ops mailbox
      # (scripts/pipeline-alert.ts; same channel as cronjob.sh).
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-Subsumio <hello@subsum.io>}
      QUEUE_ALERT_EMAIL: ${QUEUE_ALERT_EMAIL:-}
      PIPELINE_ALERT_STATE_DIR: /root/subsumio-pipeline-logs/alert-state
      # OpenRouter (for embedding calls via auto-embed-pg.ts). Set
      # OPENROUTER_API_KEY_PIPELINE in .env to give bulk embedding its own key
      # with its own spend limit, separate from the engine's answers.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY_PIPELINE:-${OPENROUTER_API_KEY:-}}
      OPENROUTER_API_KEY_FALLBACK: ${OPENROUTER_API_KEY_FALLBACK:-}
      # No default on purpose. A fallback here is silent data corruption:
      # the pipeline would embed new chunks with one model into a column
      # holding another's vectors, and nothing would look wrong until
      # answers quietly got worse. Missing value = the service refuses to
      # start, with this message.
      SUBSUMIO_EMBEDDING_MODEL: ${SUBSUMIO_EMBEDDING_MODEL:?in server/deploy/netcup/.env setzen — muss zum Vektorraum der Spalte content_chunks.embedding passen}
      SUBSUMIO_EMBEDDING_DIMENSIONS: ${SUBSUMIO_EMBEDDING_DIMENSIONS:?in server/deploy/netcup/.env setzen — Breite der Spalte content_chunks.embedding}
      # RIS Proxy — disabled: all 10 proxies were dead (timeout on every HTTPS request).
      # Re-enable by setting RIS_PROXY_URLS in .env with working proxy URLs.
      RIS_PROXY_URLS: ""
      RIS_PROXY_DELAY: ${RIS_PROXY_DELAY:-1500}
      RIS_PROXY_CONCURRENCY: ${RIS_PROXY_CONCURRENCY:-0}
      # Pipeline pause flag — when "true", orchestrator reports but starts no jobs.
      # Default false: pipeline runs automatically after deploy.
      PIPELINE_PAUSED: ${PIPELINE_PAUSED:-false}
      # Embedding pause — while the corpus is still being rebuilt, a re-import
      # re-chunks documents and throws their vectors away. Everything is
      # embedded once at the end, after the final audit.
      PIPELINE_EMBED_PAUSED: ${PIPELINE_EMBED_PAUSED:-false}
      # Unified corpus root — all scripts use this path for law-corpus files
      LAW_CORPUS_ROOT: /law-corpus
      # Config home — must match engine so gbrain config.json is found
      GBRAIN_HOME: /data
      # /data is mounted read-only here; the AI spend ledger (ai-spend-*.jsonl)
      # goes to the writable log volume instead.
      GBRAIN_AUDIT_DIR: /root/subsumio-pipeline-logs/audit
      # Anthropic + OpenAI (for LLM calls in pipeline scripts)
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      # law-corpus — bind mount to host directory where fetch scripts placed files
      - ${LAW_CORPUS_HOST_DIR:-/opt/subsumio-data/law-corpus}:/law-corpus
      # The import and backfill jobs the pipeline starts get relative paths
      # (law-corpus/<dir>) and run from /app, so the corpus is needed here too.
      - ${LAW_CORPUS_HOST_DIR:-/opt/subsumio-data/law-corpus}:/app/law-corpus
      # Pipeline logs
      - corpus-logs:/root/subsumio-pipeline-logs
      # Engine data (for gbrain config.json at /data/.gbrain/config.json)
      - engine-data:/data:ro
    working_dir: /app
    healthcheck:
      test: ["NONE"]
    entrypoint: >
      sh -c "
        bun scripts/corpus-pipeline.ts --loop --interval $${PIPELINE_INTERVAL_S:-600}
      "

volumes:
  # external:true + explicit name: these volumes were created under the old
  # implicit project name before the `name:` pin above was added. The
  # hetzner_* names are the live volumes on the production box — they keep
  # their historical prefix because renaming a Docker volume orphans data.
  # Declaring them external keeps Compose attached to the SAME data instead
  # of provisioning fresh empty volumes under the new "subsumio-engine_*"
  # names. Do not remove `external: true` without migrating the data first.
  db-data:
    external: true
    name: hetzner_db-data
  engine-data:
    external: true
    name: hetzner_engine-data
  clamav-data:
    external: true
    name: hetzner_clamav-data
  caddy-data:
    external: true
    name: hetzner_caddy-data
  caddy-config:
    external: true
    name: hetzner_caddy-config
  # Local encrypted backups + the timestamp of the last successful run.
  # external: the volumes predate Compose adoption — declaring them avoids
  # the "already exists but was not created by Docker Compose" warnings.
  backup-local:
    external: true
    name: subsumio-engine_backup-local
  backup-status:
    external: true
    name: subsumio-engine_backup-status
  # Corpus data — pre-populated with law-corpus before first deploy.
  # Not external: created fresh by Compose on first `up`.
  corpus-data:
  corpus-logs:
  # Web app state mounted at /app/.data. Not external: created by Compose on
  # the first `up` after this change (as subsumio-engine_web-data).
  web-data:

networks:
  # web and engine are reachable only from this stack and from the shared
  # reverse proxy (/opt/caddy), which deploy-code.sh attaches to this network.
  # The proxy overwrites X-Real-IP with the TCP peer; the app relies on that
  # for its IP allowlist, rate limits and audit rows, so no container that
  # bypasses the proxy may share a network with web or engine.
  subsumio-edge:
    external: true
    name: subsumio-edge
