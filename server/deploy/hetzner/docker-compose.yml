# Subsumio engine — single-box production stack for Hetzner Cloud (EU).
#   db     — Postgres 16 + pgvector (brain + web auth store)
#   engine — the gbrain HTTP API + in-process ingestion worker (parses PDFs,
#            builds embeddings, answers queries) on :3131
#   web    — Next.js dashboard on :3000
#   caddy  — reverse proxy with automatic Let's Encrypt HTTPS for APP_DOMAIN
#            and ENGINE_DOMAIN
#
# Bring up:  cd server/deploy/hetzner && cp .env.example .env && <edit .env> &&
#            docker compose up -d --build
# All secrets come from .env (never committed). Files live on named volumes;
# point APP_DOMAIN + ENGINE_DOMAIN DNS A-records at this box first so Caddy
# can issue TLS.
#
# `name:` below pins the Compose project id explicitly. Without it, Compose
# derives the project name from the containing directory's basename — and
# this directory is literally named "hetzner", same as sibling deploy dirs
# for other apps sharing this box (e.g. a shop's own deploy/hetzner/). Two
# compose files resolving to the same implicit project name means `docker
# compose up` in ONE app's directory can remove the OTHER app's containers
# as "orphans" (2026-07-14 incident: a sibling app's deploy wiped this
# entire stack — db, engine, clamav, web, caddy, cron, backup — while its
# own container survived, because they collided on the "hetzner" project
# name). Pinning an explicit name here makes this project immune to that
# collision regardless of what any other compose file on the box is named.
name: subsumio-engine

services:
  clamav:
    image: clamav/clamav:stable
    restart: unless-stopped
    environment:
      # Keep ClamAV's INSTREAM ceiling aligned with the application's 500 MB
      # document limit. The image default is only 100 MB and otherwise causes
      # valid large uploads to fail closed as "scanner unavailable".
      CLAMD_CONF_StreamMaxLength: "524288000"
      CLAMD_CONF_MaxFileSize: "524288000"
      CLAMD_CONF_MaxScanSize: "1073741824"
    volumes:
      - clamav-data:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping 1 >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    # clamd stays on the private compose network; no host port is published.

  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    shm_size: 4gb
    command: >
      postgres
      -c shared_buffers=2GB
      -c effective_cache_size=6GB
      -c work_mem=32MB
      -c maintenance_work_mem=2GB
      -c effective_io_concurrency=200
      -c wal_buffers=16MB
      -c checkpoint_completion_target=0.9
      -c random_page_cost=1.1
      -c max_parallel_workers=4
      -c max_parallel_workers_per_gather=2
      -c max_parallel_maintenance_workers=4
      -c autovacuum=on
      -c autovacuum_naptime=30s
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-subsumio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-subsumio}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-subsumio} -d ${POSTGRES_DB:-subsumio}"]
      interval: 10s
      timeout: 5s
      retries: 6
    # Published on localhost only — allows SSH-tunnel access for local dev
    # without exposing the DB to the internet. Engine still uses the compose
    # network internally. To tunnel: ssh -L 15432:localhost:5432 subsumio-hetzner
    ports:
      - "127.0.0.1:5432:5432"

  engine:
    build:
      context: ../.. # = server/  (where the Dockerfile lives)
      dockerfile: Dockerfile
    restart: unless-stopped
    shm_size: 1gb
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-subsumio}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-subsumio}
      PORT: "3131"
      SUBSUMIO_HOME: /data
      GBRAIN_HOME: /data # legacy alias for engine internals
      CLAMAV_HOST: clamav:3310
      SUBSUMIO_PRESIGNED_UPLOAD_ENABLED: ${SUBSUMIO_PRESIGNED_UPLOAD_ENABLED:-false}
      # Unified corpus root — engine reads law files from here
      LAW_CORPUS_ROOT: /law-corpus
    volumes:
      - engine-data:/data # uploaded files / vault on durable volume
      # Read-only ADVOKAT export/document mirror. Point the host side at an
      # SMB/CIFS mount or scheduled ADVOKAT export directory.
      - ${ADVOKAT_IMPORT_HOST_PATH:-./imports/advokat}:/imports/advokat:ro
    depends_on:
      db:
        condition: service_healthy
      clamav:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'bun -e "fetch(''http://localhost:3131/health'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  web:
    build:
      context: ../../.. # = repo root (Next.js app)
      dockerfile: Dockerfile.web
      args:
        NEXT_PUBLIC_APP_URL: "https://${APP_DOMAIN:?set APP_DOMAIN in .env}"
        NEXT_PUBLIC_SITE_URL: "https://${APP_DOMAIN:?set APP_DOMAIN in .env}"
        NEXT_PUBLIC_DIRECT_UPLOAD_MAX_BYTES: "${NEXT_PUBLIC_DIRECT_UPLOAD_MAX_BYTES:-524288000}"
        NEXT_PUBLIC_ENGINE_URL: "https://${ENGINE_DOMAIN:?set ENGINE_DOMAIN in .env}"
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      NEXT_TELEMETRY_DISABLED: "1"
      SUBSUMIO_API_URL: http://engine:3131
      NEXT_PUBLIC_APP_URL: "https://${APP_DOMAIN:?set APP_DOMAIN in .env}"
      NEXT_PUBLIC_SITE_URL: "https://${APP_DOMAIN:?set APP_DOMAIN in .env}"
      SUBSUMIO_AUTH_DATABASE_URL: postgres://${POSTGRES_USER:-subsumio}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-subsumio}?sslmode=disable
      DATABASE_URL: postgres://${POSTGRES_USER:-subsumio}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-subsumio}?sslmode=disable
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-524288000}
      MAX_TABULAR_UPLOAD_BYTES: ${MAX_TABULAR_UPLOAD_BYTES:-20971520}
      NEXT_PUBLIC_DIRECT_UPLOAD_MAX_BYTES: ${NEXT_PUBLIC_DIRECT_UPLOAD_MAX_BYTES:-524288000}
      NEXT_PUBLIC_ENGINE_URL: "https://${ENGINE_DOMAIN:?set ENGINE_DOMAIN in .env}"
    depends_on:
      db:
        condition: service_healthy
      engine:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'bun -e "fetch(''http://localhost:3000/api/health'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?set APP_DOMAIN in .env}
      ENGINE_DOMAIN: ${ENGINE_DOMAIN:?set ENGINE_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web
      - engine

  cron:
    image: alpine:3.20
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    environment:
      CRON_SECRET: ${CRON_SECRET:?set CRON_SECRET in .env}
    volumes:
      - ./crontab:/etc/crontab:ro
    entrypoint: >
      sh -c "
        apk add --no-cache curl supercronic &&
        export CRON_SECRET &&
        supercronic /etc/crontab
      "

  # Encrypted offsite backup + restore-verification (restic → Hetzner Object
  # Storage / Storage Box). Daily pg_dump + original files; weekly restore drill.
  # Inert until the BACKUP_* vars are set in .env — the stack runs fine without
  # them (the service just logs that the repo isn't configured and idles).
  backup:
    image: alpine:3.20
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # restic repo + encryption key (offline-stored password!)
      RESTIC_REPOSITORY: ${BACKUP_RESTIC_REPOSITORY:-}
      RESTIC_PASSWORD: ${BACKUP_RESTIC_PASSWORD:-}
      # s3: repos (Hetzner Object Storage / R2 / S3)
      AWS_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:-}
      # Postgres connection (same network as db)
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-subsumio}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-subsumio}
      # Alert channel (reused from the queue-alert watchdog)
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-Subsumio <hello@subsum.io>}
      QUEUE_ALERT_EMAIL: ${QUEUE_ALERT_EMAIL:-}
    volumes:
      # Original files — only needed when STORAGE_BACKEND=local. Harmless if s3.
      - engine-data:/data:ro
      - ./backup:/backup:ro
    entrypoint: >
      sh -c "
        apk add --no-cache restic postgresql16-client curl supercronic ca-certificates &&
        if [ -z \"$RESTIC_REPOSITORY\" ]; then
          echo '[backup] BACKUP_RESTIC_REPOSITORY not set — backup disabled, idling.' ;
          while true; do sleep 86400; done ;
        else
          supercronic /backup/crontab ;
        fi
      "

  # Corpus Pipeline Orchestrator — supervises the legal-corpus ingest chain
  # (backfill → import → embed → reconcile). State is DB-backed via
  # pipeline_state table, so container restarts are safe. Uses PID tracking
  # + timeout enforcement for child processes. See scripts/corpus-pipeline.ts.
  #
  # The law-corpus volume must be pre-populated (fetch-all-at-judikatur.ts,
  # import-eu-corpus.ts, etc.) — this service does NOT do initial discovery.
  # It only orchestrates backfill/import/embed for files already on disk.
  corpus-pipeline:
    build:
      context: ../.. # = server/ dir
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      engine:
        condition: service_healthy
    networks:
      - hetzner_default
    environment:
      # DB connection (same network as db)
      DATABASE_URL: postgres://${POSTGRES_USER:-subsumio}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-subsumio}?sslmode=disable
      # Engine API (for import + embed calls)
      SUBSUMIO_ENGINE_URL: http://engine:3131
      # Pipeline config
      PIPELINE_INTERVAL_S: ${PIPELINE_INTERVAL_S:-600}
      PIPELINE_SAMPLE_SIZE: ${PIPELINE_SAMPLE_SIZE:-50}
      PIPELINE_RECONCILE_GAP: ${PIPELINE_RECONCILE_GAP:-0.05}
      # Alert webhook (optional — set ALERT_WEBHOOK in .env to enable)
      ALERT_WEBHOOK: ${ALERT_WEBHOOK:-}
      # OpenRouter (for embedding calls via auto-embed-pg.ts)
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_API_KEY_FALLBACK: ${OPENROUTER_API_KEY_FALLBACK:-}
      SUBSUMIO_EMBEDDING_MODEL: ${SUBSUMIO_EMBEDDING_MODEL:-openrouter:openai/text-embedding-3-small}
      SUBSUMIO_EMBEDDING_DIMENSIONS: ${SUBSUMIO_EMBEDDING_DIMENSIONS:-1536}
      # RIS Proxy — disabled: all 10 proxies were dead (timeout on every HTTPS request).
      # Re-enable by setting RIS_PROXY_URLS in .env with working proxy URLs.
      RIS_PROXY_URLS: ""
      RIS_PROXY_DELAY: ${RIS_PROXY_DELAY:-1500}
      RIS_PROXY_CONCURRENCY: ${RIS_PROXY_CONCURRENCY:-0}
      # Pipeline pause flag — when "true", orchestrator reports but starts no jobs
      PIPELINE_PAUSED: ${PIPELINE_PAUSED:-true}
      # Unified corpus root — all scripts use this path for law-corpus files
      LAW_CORPUS_ROOT: /law-corpus
      # Config home — must match engine so gbrain config.json is found
      GBRAIN_HOME: /data
      # Anthropic + OpenAI (for LLM calls in pipeline scripts)
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      # law-corpus — bind mount to host directory where fetch scripts placed files
      - /opt/subsumio/law-corpus:/law-corpus
      # Pipeline logs
      - corpus-logs:/root/subsumio-pipeline-logs
      # Engine data (for gbrain config.json at /data/.gbrain/config.json)
      - engine-data:/data:ro
    working_dir: /app
    healthcheck:
      test: ["NONE"]
    entrypoint: >
      sh -c "
        bun scripts/corpus-pipeline.ts --loop --interval $${PIPELINE_INTERVAL_S:-600}
      "

volumes:
  # external:true + explicit name: these volumes were created under the old
  # implicit "hetzner" project name before the `name:` pin above was added.
  # Declaring them external keeps Compose attached to the SAME data instead
  # of provisioning fresh empty volumes under the new "subsumio-engine_*"
  # names. Do not remove `external: true` without migrating the data first.
  db-data:
    external: true
    name: hetzner_db-data
  engine-data:
    external: true
    name: hetzner_engine-data
  clamav-data:
    external: true
    name: hetzner_clamav-data
  caddy-data:
    external: true
    name: hetzner_caddy-data
  caddy-config:
    external: true
    name: hetzner_caddy-config
  # Corpus data — pre-populated with law-corpus before first deploy.
  # Not external: created fresh by Compose on first `up`.
  corpus-data:
  corpus-logs:

networks:
  hetzner_default:
    external: true
