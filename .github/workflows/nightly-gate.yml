name: Nightly Gate

# T2.6 CI- und Release-Gates — Nightly Dev-Set
# Runs the full dev-set every night: typecheck, lint, full unit tests,
# fristen benchmark, legal corpus, akten retrieval, e2e pipeline (mock).
# Produces persistent result artifacts + trend data.

on:
  schedule:
    - cron: "17 2 * * *" # 02:17 UTC daily — staggered from heavy-tests (08:17)
  workflow_dispatch:
    inputs:
      continue_on_error:
        description: "Continue running all checks even if required ones fail"
        required: false
        default: "false"
        type: choice
        options: ["true", "false"]

permissions:
  contents: read

concurrency:
  group: nightly-gate
  cancel-in-progress: false

jobs:
  nightly-gate:
    name: Nightly Dev-Set Gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gbrain_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13

      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.bun/install/cache
          key: bun-cache-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - run: bun install
      - working-directory: server
        run: bun install

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Seed CI corpus
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gbrain_test
        working-directory: server
        run: bun run src/eval/seed-ci-corpus.ts

      - name: Run Nightly Gate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gbrain_test
          CI: "true"
          CONTINUE_ON_ERROR: ${{ inputs.continue_on_error || 'false' }}
        run: |
          ARGS="--tier=nightly"
          if [ "$CONTINUE_ON_ERROR" = "true" ]; then
            ARGS="$ARGS --continue-on-error"
          fi
          bun run server/src/eval/test-gate/runner.ts $ARGS || true

      - name: Stage artifacts
        if: always()
        run: |
          mkdir -p gate-artifacts
          cp -r server/src/eval/test-gate/artifacts/nightly/* gate-artifacts/ 2>/dev/null || true
          cp -r server/src/eval/test-gate/trends/nightly.jsonl gate-artifacts/ 2>/dev/null || true
          cp /tmp/akten-retrieval-results.jsonl gate-artifacts/ 2>/dev/null || true
          cp /tmp/e2e-pipeline-results.jsonl gate-artifacts/ 2>/dev/null || true

      - name: Upload nightly gate artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-gate-${{ github.run_id }}-${{ github.run_attempt }}
          path: gate-artifacts/
          retention-days: 30
          if-no-files-found: ignore

      - name: Check gate result
        if: always()
        run: |
          ARTIFACT="server/src/eval/test-gate/artifacts/nightly/nightly-latest.json"
          if [ -f "$ARTIFACT" ]; then
            STATUS=$(python3 -c "import json; print(json.load(open('$ARTIFACT'))['overall_status'])" 2>/dev/null || echo "unknown")
            echo "Nightly gate overall_status: $STATUS"
            if [ "$STATUS" != "pass" ]; then
              echo "❌ Nightly gate FAILED — check artifacts for details"
              # Don't fail the workflow for nightly — we want artifacts uploaded
              # The gate result is visible in the artifact
              echo "::warning::Nightly gate did not pass. Check artifacts for details."
            else
              echo "✅ Nightly gate passed"
            fi
          else
            echo "⚠️ No gate artifact found — runner may have crashed"
          fi
