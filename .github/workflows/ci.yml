name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run lint

  format-check:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run format:check

  template-leak-check:
    name: Template Variable Leak Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check-template-leaks.sh

  docs-freshness:
    name: STATUS.md freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: npx tsx scripts/check-status-fresh.ts

  build:
    name: Build Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Check bundle sizes
        run: |
          LARGE_FILES=$(find .next/static/chunks -name "*.js" -size +500k 2>/dev/null || true)
          if [ -n "$LARGE_FILES" ]; then
            echo "⚠️ Large JS chunks detected (>500KB):"
            echo "$LARGE_FILES"
          fi
          echo "✓ Bundle size check complete"

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      # `verify` = tsc (app + tests) plus the web invariant guards: route
      # actions, grounding invariant (useGroundedAnswer + CitationPanel),
      # design tokens, canonical links, nested interactives, audit labels.
      - name: Web verify (typecheck + invariant guards)
        run: bun run verify

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run test:unit
      # Same suite with the wall clock moved forward by 400 days (Europe/Vienna):
      # a test that compares a fixed calendar date with the real "now" fails
      # here today instead of breaking `main` on the day the date passes.
      # Date-dependent tests fix their clock with vi.useFakeTimers +
      # vi.setSystemTime (docs/TESTING.md).
      - name: Unit tests with the clock moved forward
        run: bun run test:unit:future-clock
    name: Deploy script guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      # server/scripts/* importieren server-Deps (z.B. postgres in ris-lock.ts)
      - run: bun install
        working-directory: server
      # The guards that keep two parallel deploys from emptying the release
      # folder (see server/deploy/netcup/deploy-code.sh). Runs the script's own
      # server-side blocks against a temporary folder.
      - run: sh -n server/deploy/netcup/deploy-code.sh
      # Typecheck der gepflegten Pipeline-Scripts (tsconfig.scripts.json scoped
      # auf die von CI-Tests gedeckten Entry-Points — One-off-Utility-Scripts
      # bleiben bewusst außen vor).
      - run: bunx tsc --noEmit -p tsconfig.scripts.json
        working-directory: server
      # Läuft über alle server/scripts/*.test.ts (deploy-code, ris-delta,
      # corpus-pipeline-Integrität u.a.) — nicht nur deploy-code.
      - run: npx vitest run --config vitest.config.scripts.ts

  # Mock self-test: requests go straight to tests/e2e-workflow-mock-engine.ts,
  # no product route runs. Product workflows: playwright-functional.
  workflow-simulation:
    name: Workflow mock self-test (no product routes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - name: Run workflow mock self-test
        run: bun run test:workflow
      - name: Upload workflow report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-workflow-report
          path: tests/e2e-workflow-report.json
          retention-days: 14

  playwright-a11y:
    name: Playwright + axe Accessibility
    runs-on: ubuntu-latest
    services:
      # Playwright's webServer runs scripts/e2e-pg-setup.sh (dropdb/createdb on
      # localhost:5432) — Postgres-backed auth/org features have no file
      # fallback and 500 without it.
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun install
        working-directory: server # e2e-pg-setup.sh runs server/src/cli.ts
      - run: bunx playwright install --with-deps chromium
      - name: Run Playwright a11y + keyboard + visual tests
        run: bun run test:e2e -- --grep "accessibility|a11y|keyboard|Keyboard|visual|Visual|concierge"
        env:
          CI: "true"
          # Service container is TCP-only — PG* steer dropdb/createdb +
          # the app DB URL off the unix socket (scripts/e2e-pg-setup.sh).
          PGHOST: 127.0.0.1
          PGUSER: postgres
          PGPASSWORD: postgres
          SUBSUMIO_E2E_DB_URL: postgres://postgres:postgres@127.0.0.1:5432/subsumio_e2e?sslmode=disable

  # The core workflows end to end (matter incl. conflict check, deadlines,
  # invoice → issue → storno, upload, portal, login lockout / 2FA) against the
  # mock engine, whose answers are pinned to the real engine's by
  # src/test/e2e-mock-contract.test.ts. Spec list: `test:e2e:functional` in
  # package.json. Not yet part of production-gate: add it there once the job
  # has run green on main.
  playwright-functional:
    name: Playwright functional workflows (mock engine)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun install
        working-directory: server # e2e-pg-setup.sh runs server/src/cli.ts
      - run: bunx playwright install --with-deps chromium
      - name: Run functional Playwright workflows
        run: bun run test:e2e:functional
        env:
          CI: "true"
          PGHOST: 127.0.0.1
          PGUSER: postgres
          PGPASSWORD: postgres
          SUBSUMIO_E2E_DB_URL: postgres://postgres:postgres@127.0.0.1:5432/subsumio_e2e?sslmode=disable

  check-resolvable:
    name: Skill Tree (Reachability/MECE/DRY)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - working-directory: server
        run: bun install
      - name: Run check-resolvable --strict
        working-directory: server
        run: bun run check:resolver

  server-verify:
    name: Server Engine Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - working-directory: server
        run: bun install
      - name: Run engine verify
        working-directory: server
        run: bun run verify

  release-gate-eval:
    name: AI Quality Release Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - working-directory: server
        run: bun install
      - name: Run release-gate smoke eval (real PGLite + searchKeyword, no API costs)
        working-directory: server
        run: bun run release-gate:eval

  legal-corpus-gate:
    name: Legal Corpus (Jurisdiction + Versioning)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - working-directory: server
        run: bun install
      - name: Validate released legal corpus manifest
        working-directory: server
        run: bun run check:legal-corpus
      - name: Verify jurisdiction isolation and historical retrieval
        working-directory: server
        run: >-
          bun test
          test/legal-jurisdiction.test.ts
          test/legal-source-schema-contract.test.ts
          test/legal-corpus-integrity.test.ts
          test/legal-as-of-selection.test.ts
          test/legal-at-retrieval-quality.test.ts
          test/e2e/jurisdiction-isolation-pglite.test.ts
          test/e2e/legal-as-of-pglite.test.ts

  fristen-benchmark:
    name: Fristen-Engine Benchmark (CI Release Gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - name: Verify frontend/server fristen engine parity
        run: cmp -s src/lib/legal/frist-engine.ts server/src/core/legal/frist-engine.ts
      - name: Run frist-engine benchmark (deterministic deadline calculation)
        run: bunx vitest run src/lib/legal/frist-engine.benchmark.test.ts src/lib/ai-deadline-detect.frist-engine.test.ts src/lib/llm-deadline-extract.test.ts --reporter=verbose

  gitleaks:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  security-scan:
    name: Security Scan (Snyk + bun audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - name: bun audit (frontend)
        run: bun audit --audit-level=high
        continue-on-error: false
      - name: bun audit (server)
        working-directory: server
        run: bun audit --audit-level=high
        continue-on-error: false
      - uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high
      - name: Snyk Server Scan
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --file=server/package.json
          command: monitor

  # ──────────────────────────────────────────────────────────────────────
  # T2.6: Smoke Gate — small deterministic suite with structured artifacts
  # Runs the unified test-gate runner at tier=smoke, producing persistent
  # result artifacts + trend data. This complements the individual jobs
  # above with a structured, comparable result format.
  # ──────────────────────────────────────────────────────────────────────
  smoke-gate:
    name: Smoke Gate (T2.6 Structured)
    runs-on: ubuntu-latest
    needs: [lint, format-check, typecheck, test]
    if: always()
    # The smoke tier needs no law corpus (typecheck, lint, format, key unit
    # tests incl. server `bun test`, Playwright smoke against the MOCK engine).
    # It used to fail only for missing infrastructure — no Postgres for the
    # Playwright web server's auth DB (scripts/e2e-pg-setup.sh), no server
    # deps for the server unit tests, and a production build inside the
    # runner's 180s Playwright budget — and was masked with `|| true`. The
    # job now provides all three (same setup as playwright-a11y) and fails
    # on a failing gate.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install
      - run: bun install
        working-directory: server # server unit tests + e2e-pg-setup.sh
      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium
      - name: Pre-build web app for Playwright smoke
        # Same NEXT_PUBLIC_* values playwright.config.ts builds with; the
        # webServer then finds .next/BUILD_ID and only starts the server.
        if: needs.lint.result == 'success' && needs.format-check.result == 'success' && needs.typecheck.result == 'success' && needs.test.result == 'success'
        run: bun run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      - name: Run Smoke Gate
        env:
          CI: "true"
          PGHOST: 127.0.0.1
          PGUSER: postgres
          PGPASSWORD: postgres
          SUBSUMIO_E2E_DB_URL: postgres://postgres:postgres@127.0.0.1:5432/subsumio_e2e?sslmode=disable
        run: |
          # Only run if the prerequisite jobs passed
          if [[ "${{ needs.lint.result }}" != "success" || \
                "${{ needs.format-check.result }}" != "success" || \
                "${{ needs.typecheck.result }}" != "success" || \
                "${{ needs.test.result }}" != "success" ]]; then
            echo "⚠️ Prerequisites not met — skipping smoke gate runner"
            exit 0
          fi
          bun run server/src/eval/test-gate/runner.ts --tier=smoke
      - name: Stage smoke gate artifacts
        if: always()
        run: |
          mkdir -p gate-artifacts
          cp -r server/src/eval/test-gate/artifacts/smoke/* gate-artifacts/ 2>/dev/null || true
          cp -r server/src/eval/test-gate/trends/smoke.jsonl gate-artifacts/ 2>/dev/null || true
      - name: Upload smoke gate artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-gate-${{ github.run_id }}-${{ github.run_attempt }}
          path: gate-artifacts/
          retention-days: 14
          if-no-files-found: ignore

  production-gate:
    name: Production Gate (all checks must pass)
    runs-on: ubuntu-latest
    needs:
      [
        lint,
        format-check,
        build,
        typecheck,
        test,
        workflow-simulation,
        playwright-a11y,
        check-resolvable,
        server-verify,
        release-gate-eval,
        legal-corpus-gate,
        fristen-benchmark,
        gitleaks,
        security-scan,
        smoke-gate,
      ]
    if: always()
    steps:
      - name: Check all jobs
        run: |
          echo "Checking job results..."
          if [[ "${{ needs.lint.result }}" != "success" || \
                "${{ needs.format-check.result }}" != "success" || \
                "${{ needs.build.result }}" != "success" || \
                "${{ needs.typecheck.result }}" != "success" || \
                "${{ needs.test.result }}" != "success" || \
                "${{ needs.workflow-simulation.result }}" != "success" || \
                "${{ needs.playwright-a11y.result }}" != "success" || \
                "${{ needs.check-resolvable.result }}" != "success" || \
                "${{ needs.server-verify.result }}" != "success" || \
                "${{ needs.release-gate-eval.result }}" != "success" || \
                "${{ needs.legal-corpus-gate.result }}" != "success" || \
                "${{ needs.fristen-benchmark.result }}" != "success" || \
                "${{ needs.gitleaks.result }}" != "success" || \
                "${{ needs.security-scan.result }}" != "success" ]]; then
            echo "❌ One or more required jobs failed"
            exit 1
          fi
          echo "✅ All required jobs passed — production gate open"

  # Branch protection requires a check literally named "ci". This thin job is
  # that check: it runs after the production gate and fails whenever the gate
  # did not succeed, so the required check reflects the real CI outcome.
  ci:
    runs-on: ubuntu-latest
    needs: [production-gate]
    if: always()
    steps:
      - name: Aggregate result
        run: |
          if [[ "${{ needs.production-gate.result }}" != "success" ]]; then
            echo "❌ production-gate result: ${{ needs.production-gate.result }}"
            exit 1
          fi
          echo "✅ ci gate passed"
