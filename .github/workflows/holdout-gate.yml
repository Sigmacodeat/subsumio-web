name: Holdout Gate

# T2.6 CI- und Release-Gates — Holdout Test-Set
# Runs ONLY on model/product releases (manual dispatch or labeled PRs).
# Includes LLM quality gates: subsumption benchmark, A/B model comparison.
# Requires API keys (OPENROUTER_API_KEY) and incurs LLM costs.
#
# Trigger options:
#   1. Manual workflow_dispatch (with version + reason)
#   2. PR label "holdout-gate" (for pre-release validation)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version string (e.g. 0.42.38.0)"
        required: true
        type: string
      reason:
        description: "Reason for holdout run (e.g. 'Model upgrade: DeepSeek V4 → V5')"
        required: true
        type: string
      continue_on_error:
        description: "Continue running all checks even if required ones fail"
        required: false
        default: "false"
        type: choice
        options: ["true", "false"]
  pull_request:
    types: [labeled, synchronize, reopened]
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: holdout-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  holdout-gate:
    name: Holdout (Model/Product Release)
    # Only run on PRs with the holdout-gate label, or on manual dispatch
    if: |
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'holdout-gate')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gbrain_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-cache-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - run: bun install
      - working-directory: server
        run: bun install

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Install gitleaks
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz" | tar -xz -C /usr/local/bin gitleaks
          chmod +x /usr/local/bin/gitleaks

      - name: Run Holdout Gate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gbrain_test
          CI: "true"
          NEXT_TELEMETRY_DISABLED: "1"
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_API_KEY_FALLBACK: ${{ secrets.OPENROUTER_API_KEY_FALLBACK }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          HOLDOUT_VERSION: ${{ inputs.version || 'pr-test' }}
          HOLDOUT_REASON: ${{ inputs.reason || 'PR holdout-gate label' }}
          CONTINUE_ON_ERROR: ${{ inputs.continue_on_error || 'false' }}
        run: |
          ARGS="--tier=holdout"
          if [ "$CONTINUE_ON_ERROR" = "true" ]; then
            ARGS="$ARGS --continue-on-error"
          fi
          bun run server/src/eval/test-gate/runner.ts $ARGS

      - name: Stage artifacts
        if: always()
        run: |
          mkdir -p gate-artifacts
          cp -r server/src/eval/test-gate/artifacts/holdout/* gate-artifacts/ 2>/dev/null || true
          cp -r server/src/eval/test-gate/trends/holdout.jsonl gate-artifacts/ 2>/dev/null || true
          cp /tmp/subsumption-results.jsonl gate-artifacts/ 2>/dev/null || true
          cp /tmp/ab-comparison-results.jsonl gate-artifacts/ 2>/dev/null || true
          cp /tmp/akten-retrieval-results.jsonl gate-artifacts/ 2>/dev/null || true
          cp /tmp/e2e-pipeline-results.jsonl gate-artifacts/ 2>/dev/null || true
          # Write metadata
          echo '{"version":"${{ inputs.version }}","reason":"${{ inputs.reason }}","run_id":"${{ github.run_id }}"}' > gate-artifacts/holdout-metadata.json

      - name: Upload holdout gate artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: holdout-gate-${{ inputs.version || github.run_id }}-${{ github.run_attempt }}
          path: gate-artifacts/
          retention-days: 365
          if-no-files-found: ignore

      - name: Enforce gate result
        if: always()
        run: |
          ARTIFACT="server/src/eval/test-gate/artifacts/holdout/holdout-latest.json"
          if [ ! -f "$ARTIFACT" ]; then
            echo "❌ No gate artifact found — runner may have crashed"
            exit 1
          fi
          STATUS=$(python3 -c "import json; print(json.load(open('$ARTIFACT'))['overall_status'])" 2>/dev/null || echo "unknown")
          FAILED=$(python3 -c "import json; d=json.load(open('$ARTIFACT')); print(d['failed'])" 2>/dev/null || echo "?")
          ERRORED=$(python3 -c "import json; d=json.load(open('$ARTIFACT')); print(d['errored'])" 2>/dev/null || echo "?")
          echo "Holdout gate overall_status: $STATUS"
          echo "Failed: $FAILED, Errored: $ERRORED"
          if [ "$STATUS" != "pass" ]; then
            echo "❌ Holdout gate FAILED — model/product release blocked"
            exit 1
          fi
          echo "✅ Holdout gate passed — model/product release can proceed"
