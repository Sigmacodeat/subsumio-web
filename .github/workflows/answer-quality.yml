name: Answer Quality Gate

# Blocking LLM answer-quality gate for changes to the answer pipeline.
# Runs the REAL think pipeline (retrieval + model + guardrail + cross-verify)
# on a small fixture corpus (server/src/eval/answer-quality) and fails when
# the pass rate drops below 80 % or any Austrian answer cites German law.
#
# The retrieval half (no model, free) runs in every build as a unit test:
# server/test/answer-quality-retrieval.test.ts.
#
# Cost: a few cents per run. Requires the ANTHROPIC_API_KEY (preferred) or
# OPENROUTER_API_KEY repository secret; without one the job FAILS — a gate
# that silently passes without a model is no gate.

on:
  pull_request:
    branches: [main, develop]
    paths:
      - "server/src/core/think/**"
      - "server/src/core/search/**"
      - "server/src/core/ai/**"
      - "server/src/core/model-config.ts"
      - "server/src/core/citation-guardrail.ts"
      - "server/src/core/ensemble-verify.ts"
      - "server/src/eval/answer-quality/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: answer-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  answer-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13
      - working-directory: server
        run: bun install
      - name: Require model key
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ] && [ -z "$OPENROUTER_API_KEY" ]; then
            echo "::error::ANTHROPIC_API_KEY / OPENROUTER_API_KEY secret missing — the answer-quality gate cannot run."
            exit 1
          fi
          # Native Anthropic when available, otherwise route everything via OpenRouter.
          if [ -z "$ANTHROPIC_API_KEY" ]; then echo "SUBSUMIO_AI_PROVIDER=openrouter" >> "$GITHUB_ENV"; fi
      - name: Answer-quality eval (blocking)
        working-directory: server
        run: bun run src/eval/answer-quality/run.ts --min-pass=0.8
