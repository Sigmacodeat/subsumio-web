name: Release Gate

# T2.6 CI- und Release-Gates — Release Test-Set + Security/Isolation
# Runs on version tags (v*) and manual dispatch.
# Full test-set + security scan + isolation tests + heavy tests.
# Gate must pass for a release to proceed.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version string (e.g. 0.42.38.0)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-gate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-gate:
    name: Release Test-Set + Security/Isolation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gbrain_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_is_ready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13

      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.bun/install/cache
          key: bun-cache-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - run: bun install
      - working-directory: server
        run: bun install

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Seed CI corpus
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gbrain_test
        working-directory: server
        run: bun run src/eval/seed-ci-corpus.ts

      - name: Install gitleaks
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz" | tar -xz -C /usr/local/bin gitleaks
          chmod +x /usr/local/bin/gitleaks

      - name: Run Release Gate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gbrain_test
          CI: "true"
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          bun run server/src/eval/test-gate/runner.ts --tier=release --continue-on-error

      - name: Stage artifacts
        if: always()
        run: |
          mkdir -p gate-artifacts
          cp -r server/src/eval/test-gate/artifacts/release/* gate-artifacts/ 2>/dev/null || true
          cp -r server/src/eval/test-gate/trends/release.jsonl gate-artifacts/ 2>/dev/null || true
          cp /tmp/akten-retrieval-results.jsonl gate-artifacts/ 2>/dev/null || true
          cp /tmp/e2e-pipeline-results.jsonl gate-artifacts/ 2>/dev/null || true

      - name: Upload release gate artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-gate-${{ github.run_id }}-${{ github.run_attempt }}
          path: gate-artifacts/
          retention-days: 90
          if-no-files-found: ignore

      - name: Enforce gate result
        run: |
          ARTIFACT="server/src/eval/test-gate/artifacts/release/release-latest.json"
          if [ ! -f "$ARTIFACT" ]; then
            echo "❌ No gate artifact found — runner may have crashed"
            exit 1
          fi
          STATUS=$(python3 -c "import json; print(json.load(open('$ARTIFACT'))['overall_status'])" 2>/dev/null || echo "unknown")
          FAILED=$(python3 -c "import json; d=json.load(open('$ARTIFACT')); print(d['failed'])" 2>/dev/null || echo "?")
          ERRORED=$(python3 -c "import json; d=json.load(open('$ARTIFACT')); print(d['errored'])" 2>/dev/null || echo "?")
          echo "Release gate overall_status: $STATUS"
          echo "Failed: $FAILED, Errored: $ERRORED"
          if [ "$STATUS" != "pass" ]; then
            echo "❌ Release gate FAILED — release blocked"
            exit 1
          fi
          echo "✅ Release gate passed — release can proceed"
